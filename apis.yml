aid: entactbio
name: Entact Bio
description: 'Entact Bio is a preclinical-stage biotechnology company based in Watertown,
  Massachusetts, developing a new class of small-molecule precision medicines called
  Enhancement-Targeting Chimeric (ENTAC) molecules. Where targeted protein degradation
  removes disease-causing proteins, Entact Bio works in the opposite direction: its
  ENTAC molecules recruit deubiquitinases (DUBs) to strip ubiquitin chains from beneficial
  proteins in order to extend their half-life, relocate them, or otherwise restore
  their function. The company''s proprietary Encompass platform combines biological,
  chemical, and computational tools to identify disease targets amenable to protein
  enhancement across oncology, autoimmune disease, and rare genetic disorders. Entact
  Bio launched in December 2022 with an $81 million Series A co-led by Qiming Venture
  Partners USA and venBio Partners, with participation from Abingworth, Brandon Capital,
  and others. It is a therapeutics research organization and publishes no public developer
  program, API, or machine-readable API artifacts.'
